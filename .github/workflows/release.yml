name: Release Desktop Packages

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v1.0.0; leave empty to auto-generate)"
        required: false
        default: ""
        type: string

permissions:
  contents: write

jobs:
  build-matrix:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform_name: windows
            extra_args: "--skip-src"
          - os: macos-latest
            platform_name: macos
            extra_args: "--skip-src"
          - os: ubuntu-latest
            platform_name: linux
            extra_args: ""

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Linux Tkinter system package
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk

      - name: Install PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller

      - name: Verify Python syntax
        run: |
          python -m py_compile python_app/proxy_core.py python_app/ui_widgets.py python_app/proxy_tester.py python_app/build_release.py

      - name: Build release archive
        run: python python_app/build_release.py ${{ matrix.extra_args }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: proxyping-${{ matrix.platform_name }}
          path: dist_release/*

  publish-release:
    needs: build-matrix
    if: success()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Resolve release tag
        id: meta
        shell: bash
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${{ github.ref_name }}"
          elif [[ -n "${{ inputs.tag }}" ]]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="v1.0.${{ github.run_number }}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Resolved release tag: $TAG"

      - name: List release files
        run: ls -lh artifacts/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ProxyPing ${{ steps.meta.outputs.tag }}
          generate_release_notes: true
          make_latest: true
          files: artifacts/*
