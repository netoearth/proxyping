name: Release Desktop Packages

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v1.0.0; leave empty to auto-generate)"
        required: false
        default: ""
        type: string

permissions:
  contents: write

jobs:
  build-matrix:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform_name: windows
            extra_args: "--skip-src"
          - os: macos-latest
            platform_name: macos
            extra_args: "--skip-src"
          - os: ubuntu-latest
            platform_name: linux
            extra_args: "--require-appimage"

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        if: runner.os != 'Linux'
        with:
          python-version: "3.11"

      - name: Install PyInstaller (Windows / macOS)
        if: runner.os != 'Linux'
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller

      - name: Verify Python syntax (Windows / macOS)
        if: runner.os != 'Linux'
        run: |
          python -m py_compile python_app/proxy_core.py python_app/ui_widgets.py python_app/proxy_tester.py python_app/build_release.py

      - name: Build release archive (Windows / macOS)
        if: runner.os != 'Linux'
        run: python python_app/build_release.py ${{ matrix.extra_args }}

      - name: Build Linux AppImage in Ubuntu 22.04 (GLIBC 2.35)
        if: runner.os == 'Linux'
        run: |
          curl -fsSL "https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage" -o /tmp/appimagetool
          chmod +x /tmp/appimagetool
          docker run --rm \
            -v "${{ github.workspace }}:/work" \
            -v "/tmp/appimagetool:/usr/local/bin/appimagetool:ro" \
            -w /work \
            -e DEBIAN_FRONTEND=noninteractive \
            -e APPIMAGETOOL=/usr/local/bin/appimagetool \
            -e HOST_UID="$(id -u)" \
            -e HOST_GID="$(id -g)" \
            ubuntu:22.04 \
            bash -euo pipefail -c '
              apt-get update
              apt-get install -y --no-install-recommends \
                python3 python3-pip python3-tk binutils desktop-file-utils file ca-certificates
              python3 -m pip install --no-cache-dir --upgrade pip
              python3 -m pip install --no-cache-dir pyinstaller
              python3 -m py_compile python_app/proxy_core.py python_app/ui_widgets.py python_app/proxy_tester.py python_app/build_release.py
              python3 python_app/build_release.py --require-appimage
              echo "Verifying max GLIBC requirement <= GLIBC_2.35..."
              bad_glibc=0
              while IFS= read -r -d "" elf; do
                max_ver=$(objdump -T "$elf" 2>/dev/null | grep -oE "GLIBC_[0-9]+(\.[0-9]+)+" | sort -Vu | tail -n 1 || true)
                if [ -n "$max_ver" ]; then
                  if [ "$(printf "GLIBC_2.35\n%s\n" "$max_ver" | sort -V | tail -n 1)" != "GLIBC_2.35" ]; then
                    echo "ERROR: $elf requires $max_ver > GLIBC_2.35" >&2
                    bad_glibc=1
                  fi
                fi
              done < <(find python_app/build/ProxyPing.AppDir -type f \( -name "*.so*" -o -executable \) -print0)
              [ "$bad_glibc" -eq 0 ]
              APPIMAGE_EXTRACT_AND_RUN=1 ./dist_release/ProxyPing-linux-x64.AppImage --check
              chown -R "$HOST_UID:$HOST_GID" dist_release python_app/build python_app/dist
            '
          echo "Verifying forward compatibility on host runner..."
          APPIMAGE_EXTRACT_AND_RUN=1 ./dist_release/ProxyPing-linux-x64.AppImage --check

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: proxyping-${{ matrix.platform_name }}
          path: dist_release/*

  publish-release:
    needs: build-matrix
    if: success()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Resolve release tag
        id: meta
        shell: bash
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${{ github.ref_name }}"
          elif [[ -n "${{ inputs.tag }}" ]]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="v1.0.${{ github.run_number }}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Resolved release tag: $TAG"

      - name: List release files
        run: ls -lh artifacts/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ProxyPing ${{ steps.meta.outputs.tag }}
          generate_release_notes: true
          make_latest: true
          files: artifacts/*
